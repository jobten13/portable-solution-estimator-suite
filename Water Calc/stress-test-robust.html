<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Calc - Stress Test Robust</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f5f8; color: #0f172a; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 14px; color: #334155; }
    button {
      border: 0; background: #1e40af; color: #fff; border-radius: 8px;
      padding: 10px 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #summary {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: #e2e8f0; font-weight: 600;
    }
    #results {
      margin-top: 14px; background: #fff; border: 1px solid #dbe2ea;
      border-radius: 10px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eef2f7; text-align: left; vertical-align: top; }
    th { background: #f8fafc; font-weight: 700; }
    .pass { color: #166534; font-weight: 700; }
    .fail { color: #b91c1c; font-weight: 700; }
    .mono { font-family: Consolas, monospace; font-size: 0.85rem; color: #475569; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Water Calculator - Stress Test Robust</h1>
    <p>
      Standalone robustness checks for core water-logic behavior: boundaries, mains modes, visibility flags,
      and monotonicity/invariant checks.
    </p>
    <button id="run-btn" type="button">Run Robust Stress Test</button>
    <div id="summary">Ready.</div>
    <div id="results"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var L_PER_GAL = 3.78541;

      function calcModel(state) {
        var days = Math.max(0, Number(state.days) || 0);
        var beds = Math.max(0, Number(state.beds) || 0);
        var bufferPercent = Math.max(0, Number(state.bufferPercent) || 0);
        var potableRate = Math.max(0, Number(state.potableRate) || 0); // L/bed/day
        var wastewaterRate = Math.max(0, Number(state.wastewaterRate) || 0); // L/bed/day
        var potableCount = Math.max(0, Number(state.potableContainerCount) || 0);
        var potableCap = Math.max(0, Number(state.potableContainerCapacity) || 0); // L
        var wastewaterCount = Math.max(0, Number(state.wastewaterContainerCount) || 0);
        var wastewaterCap = Math.max(0, Number(state.wastewaterContainerCapacity) || 0); // L
        var potableMode = state.potableSupplyMode || 'self'; // self | mains | hybrid
        var wastewaterMode = state.wastewaterDisposalMode || 'containers'; // containers | mains
        var mainsFlowLhr = Math.max(0, Number(state.mainsFlowRate) || 0);

        var mult = 1 + (bufferPercent / 100);
        var potablePerDay = beds * potableRate;
        var wastewaterPerDay = beds * wastewaterRate;
        var totalPotable = days * potablePerDay * mult;
        var totalWastewater = days * wastewaterPerDay * mult;
        var potableStorage = potableCount * potableCap;
        var wastewaterStorage = wastewaterCount * wastewaterCap;

        var showMains = (potableMode === 'mains' || potableMode === 'hybrid');
        var rows = {
          potableDelivery: (potableMode === 'self' || potableMode === 'hybrid'),
          potableMains: showMains,
          potableBuffer: showMains,
          wastewaterPickup: (wastewaterMode === 'containers'),
          wastewaterMains: (wastewaterMode === 'mains')
        };

        var potableDeliveryText = '';
        if (rows.potableDelivery) {
          if (days <= 0 || beds <= 0) {
            potableDeliveryText = 'Enter deployment length and number of beds';
          } else if (potableStorage > 0 && potablePerDay > 0) {
            var potableIntervalDays = potableStorage / potablePerDay;
            var potableDeliveries = Math.ceil(totalPotable / potableStorage);
            potableDeliveryText = 'Delivery every ' + potableIntervalDays.toFixed(1) + ' days (' + potableDeliveries + ' deliveries)';
          } else {
            potableDeliveryText = 'Set potable container count and capacity';
          }
        }

        var wastewaterPickupText = '';
        if (rows.wastewaterPickup) {
          if (days <= 0 || beds <= 0) {
            wastewaterPickupText = 'Enter deployment length and number of beds';
          } else if (wastewaterStorage > 0 && wastewaterPerDay > 0) {
            var wastewaterIntervalDays = wastewaterStorage / wastewaterPerDay;
            var wastewaterPickups = Math.ceil(totalWastewater / wastewaterStorage);
            wastewaterPickupText = 'Pickup every ' + wastewaterIntervalDays.toFixed(1) + ' days (' + wastewaterPickups + ' pickups)';
          } else {
            wastewaterPickupText = 'Set wastewater container count and capacity';
          }
        }

        var mainsStatus = '';
        var mainsClass = '';
        if (showMains) {
          if (days <= 0 || beds <= 0 || potablePerDay <= 0) {
            mainsStatus = 'Enter deployment length, beds, and rates';
            mainsClass = 'info';
          } else if (mainsFlowLhr <= 0) {
            mainsStatus = 'Enter mains flow rate';
            mainsClass = 'warn';
          } else {
            var hoursAtPeak = 16; // aligns with calculator assumption
            var requiredLhr = potablePerDay / hoursAtPeak;
            var adequateLhr = requiredLhr * 1.25;
            if (mainsFlowLhr >= adequateLhr) {
              mainsStatus = 'Adequate for projected demand';
              mainsClass = 'ok';
            } else if (mainsFlowLhr >= requiredLhr) {
              mainsStatus = 'Marginal: adequate only with low downtime and close monitoring';
              mainsClass = 'warn';
            } else {
              mainsStatus = 'Insufficient: add deliveries/storage or increase mains capacity';
              mainsClass = 'danger';
            }
          }
        }

        var potableBuffer = potablePerDay * 2; // 48h equivalent

        return {
          totals: {
            potablePerDay: potablePerDay,
            wastewaterPerDay: wastewaterPerDay,
            totalPotable: totalPotable,
            totalWastewater: totalWastewater
          },
          rows: rows,
          texts: {
            potableDelivery: potableDeliveryText,
            wastewaterPickup: wastewaterPickupText,
            mainsStatus: mainsStatus
          },
          mainsClass: mainsClass,
          recommendedBufferLiters: potableBuffer
        };
      }

      function near(a, b, tol) {
        return Math.abs(a - b) <= (tol || 1e-6);
      }

      var tests = [];
      function test(name, fn) { tests.push({ name: name, fn: fn }); }

      function baseState() {
        return {
          days: 30,
          beds: 40,
          bufferPercent: 10,
          potableRate: 80,
          wastewaterRate: 65,
          potableContainerCount: 6,
          potableContainerCapacity: 1000,
          wastewaterContainerCount: 6,
          wastewaterContainerCapacity: 1000,
          potableSupplyMode: 'self',
          wastewaterDisposalMode: 'containers',
          mainsFlowRate: 0
        };
      }

      test('Zero input boundaries remain zero', function () {
        var s = baseState();
        s.days = 0;
        s.beds = 0;
        var r = calcModel(s);
        return r.totals.totalPotable === 0 &&
          r.totals.totalWastewater === 0 &&
          r.texts.potableDelivery.indexOf('Enter deployment length') === 0 &&
          r.texts.wastewaterPickup.indexOf('Enter deployment length') === 0;
      });

      test('Self supply + containers yields delivery/pickup estimates', function () {
        var r = calcModel(baseState());
        return r.rows.potableDelivery &&
          r.rows.wastewaterPickup &&
          r.texts.potableDelivery.indexOf('Delivery every') === 0 &&
          r.texts.wastewaterPickup.indexOf('Pickup every') === 0;
      });

      test('Mains adequate sets status class to ok', function () {
        var s = baseState();
        s.potableSupplyMode = 'mains';
        s.mainsFlowRate = 260; // required=200, adequate>=250 for this scenario
        var r = calcModel(s);
        return r.mainsClass === 'ok' && r.texts.mainsStatus.indexOf('Adequate') === 0;
      });

      test('Mains marginal sets status class to warn', function () {
        var s = baseState();
        s.potableSupplyMode = 'mains';
        s.mainsFlowRate = 220;
        var r = calcModel(s);
        return r.mainsClass === 'warn' && r.texts.mainsStatus.indexOf('Marginal') === 0;
      });

      test('Mains insufficient sets status class to danger', function () {
        var s = baseState();
        s.potableSupplyMode = 'mains';
        s.mainsFlowRate = 150;
        var r = calcModel(s);
        return r.mainsClass === 'danger' && r.texts.mainsStatus.indexOf('Insufficient') === 0;
      });

      test('Hybrid mode shows both delivery and mains rows', function () {
        var s = baseState();
        s.potableSupplyMode = 'hybrid';
        s.mainsFlowRate = 260;
        var r = calcModel(s);
        return r.rows.potableDelivery && r.rows.potableMains && r.rows.potableBuffer;
      });

      test('Wastewater mains hides pickup row and shows mains row', function () {
        var s = baseState();
        s.wastewaterDisposalMode = 'mains';
        var r = calcModel(s);
        return !r.rows.wastewaterPickup && r.rows.wastewaterMains;
      });

      test('48-hour recommended buffer matches 2x potable daily', function () {
        var s = baseState();
        var r = calcModel(s);
        return near(r.recommendedBufferLiters, r.totals.potablePerDay * 2);
      });

      test('Monotonic: higher bed count increases totals', function () {
        var a = baseState();
        a.beds = 20;
        var b = baseState();
        b.beds = 80;
        var ra = calcModel(a);
        var rb = calcModel(b);
        return rb.totals.totalPotable > ra.totals.totalPotable &&
          rb.totals.totalWastewater > ra.totals.totalWastewater;
      });

      test('Monotonic: higher buffer percent increases totals', function () {
        var a = baseState();
        a.bufferPercent = 0;
        var b = baseState();
        b.bufferPercent = 20;
        var ra = calcModel(a);
        var rb = calcModel(b);
        return rb.totals.totalPotable > ra.totals.totalPotable &&
          rb.totals.totalWastewater > ra.totals.totalWastewater;
      });

      test('Container prompt appears when storage unset', function () {
        var s = baseState();
        s.potableContainerCount = 0;
        s.potableContainerCapacity = 0;
        var r = calcModel(s);
        return r.texts.potableDelivery.indexOf('Set potable container count and capacity') === 0;
      });

      test('Gallons conversion sanity check (display helper)', function () {
        var liters = 379; // ~100 gal
        var gallonsRoundedUp = Math.ceil(liters / L_PER_GAL);
        return gallonsRoundedUp === 101 && near(gallonsRoundedUp * L_PER_GAL, 382.32641, 1e-5);
      });

      function run() {
        var out = document.getElementById('results');
        var summary = document.getElementById('summary');
        var rows = [];
        var pass = 0;
        var fail = 0;

        for (var i = 0; i < tests.length; i++) {
          var t = tests[i];
          var ok = false;
          var err = '';
          try {
            ok = !!t.fn();
          } catch (e) {
            ok = false;
            err = e && e.message ? e.message : String(e);
          }
          if (ok) pass++; else fail++;
          rows.push({
            name: t.name,
            status: ok ? 'PASS' : 'FAIL',
            detail: err
          });
        }

        var html = '<table><thead><tr><th>Test</th><th>Status</th><th>Notes</th></tr></thead><tbody>';
        for (var j = 0; j < rows.length; j++) {
          html += '<tr>' +
            '<td>' + rows[j].name + '</td>' +
            '<td class="' + (rows[j].status === 'PASS' ? 'pass' : 'fail') + '">' + rows[j].status + '</td>' +
            '<td class="mono">' + (rows[j].detail || '-') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table>';
        out.innerHTML = html;

        summary.textContent = 'Completed ' + tests.length + ' tests: ' + pass + ' passed, ' + fail + ' failed.';
        summary.style.background = fail ? '#fee2e2' : '#dcfce7';
        summary.style.color = fail ? '#991b1b' : '#166534';
      }

      document.getElementById('run-btn').addEventListener('click', run);
    })();
  </script>
</body>
</html>
