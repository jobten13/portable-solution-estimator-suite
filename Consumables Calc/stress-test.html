<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consumables Calc – Stress Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; }
    h1 { font-size: 1.25em; }
    button { padding: 10px 16px; margin: 8px 8px 8px 0; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; }
    button:hover { background: #1d4ed8; }
    #log { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 0.9em; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 12px; max-height: 60vh; overflow: auto; }
    .pass { color: #059669; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Consumables Calc – Stress Test</h1>
  <p>Uses the same quantity formula as the app. Load the Ward list (optional), then run tests.</p>
  <button type="button" id="run-btn">Run stress test</button>
  <div id="log"></div>

  <script src="consumables-lists.js"></script>
  <script>
    (function () {
      var logEl = document.getElementById('log');
      function log(msg, className) {
        var p = document.createElement('div');
        if (className) p.className = className;
        p.textContent = msg;
        logEl.appendChild(p);
      }

      function calculateItemQuantity(usagePerDayPerBed, deploymentDays, deploymentBeds, bufferPercentage) {
        var baseQuantity = deploymentDays * deploymentBeds * usagePerDayPerBed;
        var bufferMultiplier = 1 + (bufferPercentage / 100);
        return baseQuantity * bufferMultiplier;
      }

      var scenarios = [
        { name: 'All zeros', days: 0, beds: 0, buffer: 0 },
        { name: 'Zero days', days: 0, beds: 40, buffer: 10 },
        { name: 'Zero beds', days: 14, beds: 0, buffer: 0 },
        { name: 'Typical', days: 14, beds: 40, buffer: 10 },
        { name: 'Large', days: 90, beds: 100, buffer: 15 },
        { name: 'Stress high', days: 365, beds: 500, buffer: 20 },
        { name: 'Decimal buffer', days: 14, beds: 40, buffer: 12.5 }
      ];

      document.getElementById('run-btn').addEventListener('click', function () {
        logEl.innerHTML = '';
        var items = typeof UCD_WARD_ITEMS !== 'undefined' && UCD_WARD_ITEMS.length ? UCD_WARD_ITEMS : [
          { name: 'Mock item', usagePerDayPerBed: 2.5 }
        ];
        log('Items: ' + items.length + '\n');

        var passed = 0, failed = 0;
        for (var s = 0; s < scenarios.length; s++) {
          var sc = scenarios[s];
          var ok = true;
          var sample = [];
          for (var i = 0; i < Math.min(items.length, 3); i++) {
            var qty = calculateItemQuantity(items[i].usagePerDayPerBed, sc.days, sc.beds, sc.buffer);
            var ceiled = Math.ceil(qty);
            if (qty !== qty || !isFinite(qty) || qty < 0) { ok = false; break; }
            if (sc.days === 0 || sc.beds === 0) {
              if (qty !== 0) ok = false;
            }
            sample.push(ceiled);
          }
          if (ok) {
            passed++;
            log('PASS ' + sc.name + ' – sample: ' + sample.join(', '), 'pass');
          } else {
            failed++;
            log('FAIL ' + sc.name, 'fail');
          }
        }

        var start = Date.now();
        var total = 0;
        for (var j = 0; j < items.length; j++) {
          var q = calculateItemQuantity(items[j].usagePerDayPerBed, 30, 100, 10);
          total += Math.ceil(q);
        }
        var elapsed = Date.now() - start;
        log('\nFull list: ' + items.length + ' items, sum=' + total + ', ' + elapsed + ' ms', elapsed < 2000 ? 'pass' : 'fail');

        log('\n--- ' + passed + ' passed, ' + failed + ' failed');
      });
    })();
  </script>
</body>
</html>
