<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Calc Pro - Stress Test Robust</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f5f8; color: #0f172a; }
    .wrap { max-width: 1050px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 14px; color: #334155; }
    button {
      border: 0; background: #1e40af; color: #fff; border-radius: 8px;
      padding: 10px 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #summary {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: #e2e8f0; font-weight: 600;
    }
    #results {
      margin-top: 14px; background: #fff; border: 1px solid #dbe2ea;
      border-radius: 10px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eef2f7; text-align: left; vertical-align: top; }
    th { background: #f8fafc; font-weight: 700; }
    .pass { color: #166534; font-weight: 700; }
    .fail { color: #b91c1c; font-weight: 700; }
    .mono { font-family: Consolas, monospace; font-size: 0.85rem; color: #475569; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Load Calc Pro - Stress Test Robust</h1>
    <p>
      Standalone robustness checks for the Pro load model: running kW/kVA, largest-motor peak start logic,
      recommendation rules, filter behavior parity, and fuel runtime consistency.
    </p>
    <button id="run-btn" type="button">Run Robust Stress Test</button>
    <div id="summary">Ready.</div>
    <div id="results"></div>
  </div>

  <script src="equipment-data.js"></script>
  <script>
    (function () {
      'use strict';

      var MOTOR_START_FACTOR = 4.0;
      var CONTINUOUS_SAFETY_FACTOR = 0.8;

      function near(a, b, tol) {
        return Math.abs(a - b) <= (tol || 1e-6);
      }

      function rowKva(row) {
        var pf = row.pf > 0 ? row.pf : 1;
        return row.kw / pf;
      }

      // Mirrors Load Calc Pro core math, including filter-hidden exclusion behavior.
      function calcModel(rows, availableKva, fuelGallons, fuelRateGalPerKw, respectHidden) {
        var effectiveRows = rows.filter(function (r) { return !respectHidden || !r.hidden; });
        var totalKw = 0;
        var totalKva = 0;
        var largestMotorStartingKva = 0;
        var largestMotorIndex = -1;

        for (var i = 0; i < effectiveRows.length; i++) {
          var row = effectiveRows[i];
          var qty = Number(row.qty) || 0;
          var kwEach = Number(row.kw) || 0;
          var pfEach = Number(row.pf) > 0 ? Number(row.pf) : 1;
          var kvaEach = kwEach / pfEach;

          var itemKw = qty * kwEach;
          var itemKva = qty * kvaEach;
          totalKw += itemKw;
          totalKva += itemKva;

          var isInductive = pfEach < 0.95 && kwEach > 0.1;
          var singleUnitStart = isInductive ? kvaEach * MOTOR_START_FACTOR : kvaEach;
          if (singleUnitStart > largestMotorStartingKva) {
            largestMotorStartingKva = singleUnitStart;
            largestMotorIndex = i;
          }
        }

        var totalKvaExcludingLargest = 0;
        for (var j = 0; j < effectiveRows.length; j++) {
          var row2 = effectiveRows[j];
          var qty2 = Number(row2.qty) || 0;
          var kvaEach2 = rowKva(row2);

          if (j !== largestMotorIndex) {
            totalKvaExcludingLargest += qty2 * kvaEach2;
          } else {
            totalKvaExcludingLargest += (qty2 > 0 ? qty2 - 1 : 0) * kvaEach2;
          }
        }

        var peakKva = totalKvaExcludingLargest + (largestMotorIndex >= 0 ? largestMotorStartingKva : 0);
        if (totalKw === 0) peakKva = 0;
        if (peakKva < totalKva) peakKva = totalKva;

        var recommendedKva = totalKva / CONTINUOUS_SAFETY_FACTOR;
        var finalRecommendedKva = Math.max(peakKva, recommendedKva);
        var margin = (Number(availableKva) || 0) - totalKva;

        var runtime = 0;
        if (totalKw > 0 && fuelGallons > 0 && fuelRateGalPerKw > 0) {
          runtime = fuelGallons / (totalKw * fuelRateGalPerKw);
        }

        return {
          totalKw: totalKw,
          totalKva: totalKva,
          peakKva: peakKva,
          recommendedKva: recommendedKva,
          finalRecommendedKva: finalRecommendedKva,
          margin: margin,
          runtimeHours: runtime
        };
      }

      function row(name, qty, kw, pf, hidden) {
        return { name: name, qty: qty, kw: kw, pf: pf, hidden: !!hidden };
      }

      function buildRowsFromEquipment(defaultQty) {
        if (typeof LOAD_CALC_PRO_EQUIPMENT === 'undefined') return [];
        var out = [];
        var qty = defaultQty == null ? 1 : defaultQty;
        var cats = Object.keys(LOAD_CALC_PRO_EQUIPMENT);
        for (var i = 0; i < cats.length; i++) {
          var cat = LOAD_CALC_PRO_EQUIPMENT[cats[i]];
          var items = cat && Array.isArray(cat.items) ? cat.items : [];
          for (var j = 0; j < items.length; j++) {
            var it = items[j];
            out.push({
              name: it.name || '',
              qty: qty,
              kw: Number(it.kw) || 0,
              pf: Number(it.pf) > 0 ? Number(it.pf) : 1,
              hidden: false
            });
          }
        }
        return out;
      }

      function runRealDataSweep() {
        var sweep = [];
        if (typeof LOAD_CALC_PRO_EQUIPMENT === 'undefined') {
          sweep.push({
            name: '[Real data] equipment-data.js loaded',
            status: 'FAIL',
            detail: 'LOAD_CALC_PRO_EQUIPMENT is undefined'
          });
          return sweep;
        }

        var rows = buildRowsFromEquipment(1);
        var categories = Object.keys(LOAD_CALC_PRO_EQUIPMENT);
        var totalItems = rows.length;
        var badKw = rows.filter(function (r) { return !(r.kw >= 0); }).length;
        var badPf = rows.filter(function (r) { return !(r.pf > 0 && r.pf <= 1); }).length;

        sweep.push({
          name: '[Real data] catalog parse and shape',
          status: (categories.length > 0 && totalItems > 0) ? 'PASS' : 'FAIL',
          detail: 'categories=' + categories.length + ', items=' + totalItems
        });

        sweep.push({
          name: '[Real data] kW and PF ranges valid',
          status: (badKw === 0 && badPf === 0) ? 'PASS' : 'FAIL',
          detail: 'invalid kW=' + badKw + ', invalid PF=' + badPf
        });

        var r1 = calcModel(rows, 0, 0, 0, true);
        var finite = isFinite(r1.totalKw) && isFinite(r1.totalKva) && isFinite(r1.peakKva) && isFinite(r1.finalRecommendedKva);
        sweep.push({
          name: '[Real data] quantity=1 aggregate finite and positive',
          status: (finite && r1.totalKw > 0 && r1.totalKva > 0) ? 'PASS' : 'FAIL',
          detail: 'kW=' + r1.totalKw.toFixed(2) + ', kVA=' + r1.totalKva.toFixed(2) + ', peak=' + r1.peakKva.toFixed(2)
        });

        sweep.push({
          name: '[Real data] recommendation and peak invariants',
          status: (r1.peakKva >= r1.totalKva && r1.finalRecommendedKva >= r1.peakKva && r1.finalRecommendedKva >= r1.recommendedKva) ? 'PASS' : 'FAIL',
          detail: 'final=' + r1.finalRecommendedKva.toFixed(2) + ', rec=' + r1.recommendedKva.toFixed(2)
        });

        var rows2 = buildRowsFromEquipment(2);
        var r2 = calcModel(rows2, 0, 0, 0, true);
        sweep.push({
          name: '[Real data] monotonic qty 1 -> qty 2',
          status: (r2.totalKw > r1.totalKw && r2.totalKva > r1.totalKva) ? 'PASS' : 'FAIL',
          detail: 'kW1=' + r1.totalKw.toFixed(2) + ', kW2=' + r2.totalKw.toFixed(2)
        });

        var runtimeCheck = calcModel(rows, 0, 500, 0.08, true);
        sweep.push({
          name: '[Real data] runtime finite for nonzero fuel/rate',
          status: (runtimeCheck.totalKw > 0 && runtimeCheck.runtimeHours > 0 && isFinite(runtimeCheck.runtimeHours)) ? 'PASS' : 'FAIL',
          detail: 'runtime=' + runtimeCheck.runtimeHours.toFixed(2) + ' hr (500 gal, 0.08 gal/hr/kW)'
        });

        return sweep;
      }

      var tests = [];
      function test(name, fn) { tests.push({ name: name, fn: fn }); }

      test('Zero rows produce zero totals and zero runtime', function () {
        var r = calcModel([], 0, 0, 0, true);
        return r.totalKw === 0 && r.totalKva === 0 && r.peakKva === 0 && r.runtimeHours === 0;
      });

      test('Pure resistive loads keep peak equal to running kVA', function () {
        var rows = [
          row('Resistive A', 2, 1.5, 1.0, false),
          row('Resistive B', 1, 3.0, 1.0, false)
        ];
        var r = calcModel(rows, 0, 0, 0, true);
        return near(r.totalKva, 6.0) && near(r.peakKva, r.totalKva);
      });

      test('Largest motor start applies 4x only to one unit', function () {
        var rows = [
          row('Motor', 3, 2.0, 0.8, false),   // kvaEach=2.5, start=10
          row('Resistive', 1, 1.0, 1.0, false)
        ];
        var r = calcModel(rows, 0, 0, 0, true);
        // Total kVA = 3*2.5 + 1 = 8.5
        // Peak = (other rows:1) + (largest row running others:2*2.5=5) + 10 start = 16
        return near(r.totalKva, 8.5) && near(r.peakKva, 16.0);
      });

      test('Peak never drops below running kVA', function () {
        var rows = [
          row('Low PF tiny', 1, 0.09, 0.8, false), // does not trigger surge due to kw<=0.1
          row('Resistive', 2, 0.5, 1.0, false)
        ];
        var r = calcModel(rows, 0, 0, 0, true);
        return r.peakKva >= r.totalKva;
      });

      test('Final recommendation is max(peak, kVA/0.8)', function () {
        var rows = [row('Load', 1, 8, 1.0, false)];
        var r = calcModel(rows, 0, 0, 0, true);
        return near(r.recommendedKva, 10) && near(r.finalRecommendedKva, 10);
      });

      test('Filter behavior parity: hidden rows are excluded when enabled', function () {
        var rows = [
          row('Visible', 1, 2, 1.0, false),
          row('Hidden', 1, 3, 1.0, true)
        ];
        var withFilter = calcModel(rows, 0, 0, 0, true);
        var withoutFilter = calcModel(rows, 0, 0, 0, false);
        return near(withFilter.totalKw, 2) && near(withoutFilter.totalKw, 5);
      });

      test('Runtime formula uses gallons and gal/hr per kW', function () {
        var rows = [row('Load', 2, 5, 1.0, false)]; // 10 kW
        var r = calcModel(rows, 0, 100, 0.5, true); // burn=5 gal/hr => 20h
        return near(r.runtimeHours, 20);
      });

      test('Capacity margin equals available kVA minus running kVA', function () {
        var rows = [row('Load', 1, 4, 0.8, false)]; // running kVA=5
        var r = calcModel(rows, 12, 0, 0, true);
        return near(r.margin, 7);
      });

      test('Inductive threshold: kw <= 0.1 does not trigger motor surge', function () {
        var rows = [row('Tiny motor', 1, 0.1, 0.7, false)];
        var r = calcModel(rows, 0, 0, 0, true);
        return near(r.peakKva, r.totalKva);
      });

      test('Monotonic check: increasing qty increases total kW', function () {
        var low = calcModel([row('X', 1, 0.8, 1.0, false)], 0, 0, 0, true);
        var high = calcModel([row('X', 5, 0.8, 1.0, false)], 0, 0, 0, true);
        return high.totalKw > low.totalKw;
      });

      function run() {
        var out = document.getElementById('results');
        var summary = document.getElementById('summary');
        var rows = [];
        var pass = 0;
        var fail = 0;

        for (var i = 0; i < tests.length; i++) {
          var t = tests[i];
          var ok = false;
          var err = '';
          try {
            ok = !!t.fn();
          } catch (e) {
            ok = false;
            err = e && e.message ? e.message : String(e);
          }
          if (ok) pass++; else fail++;
          rows.push({ name: t.name, status: ok ? 'PASS' : 'FAIL', detail: err });
        }

        var realSweep = runRealDataSweep();
        for (var k = 0; k < realSweep.length; k++) {
          var rs = realSweep[k];
          if (rs.status === 'PASS') pass++; else fail++;
          rows.push(rs);
        }

        var html = '<table><thead><tr><th>Test</th><th>Status</th><th>Notes</th></tr></thead><tbody>';
        for (var j = 0; j < rows.length; j++) {
          html += '<tr>' +
            '<td>' + rows[j].name + '</td>' +
            '<td class="' + (rows[j].status === 'PASS' ? 'pass' : 'fail') + '">' + rows[j].status + '</td>' +
            '<td class="mono">' + (rows[j].detail || '-') + '</td>' +
          '</tr>';
        }
        html += '</tbody></table>';
        out.innerHTML = html;

        summary.textContent = 'Completed ' + tests.length + ' tests: ' + pass + ' passed, ' + fail + ' failed.';
        summary.style.background = fail ? '#fee2e2' : '#dcfce7';
        summary.style.color = fail ? '#991b1b' : '#166534';
      }

      document.getElementById('run-btn').addEventListener('click', run);
    })();
  </script>
</body>
</html>
